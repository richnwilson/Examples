<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>        
    <title>Document</title>
    <script>
        $("document").ready(function() {
        const myValue = "2021-02";
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            let foundValue = false;
            let $optGroup;
            for (i = new Date().getFullYear() ; i < new Date().getFullYear()+2; i++) {
                $.each(months, function (index, value) {
                    let buildMonth = i + "-" + ("00"+parseInt(index+1)).slice(-2);
                    let currentMonthChk = moment(new Date()).format("YYYY-MM");
                    if (index === 0) {
                        $optGroup = $('<optgroup />').prop('label',i);
                        
                    }
                    if (moment(buildMonth,"YYYY-MM").diff(currentMonthChk,"months") >= 0) {
                        let $newOption = $('<option />').val(buildMonth).html(value + " " + i);
                        if (myValue === buildMonth) {
                            $newOption.prop("selected",true);
                            foundValue = true;
                        }
                        $optGroup.append($newOption);
                    }
                $('#yearMonthInput').append($optGroup);                    
                });                
            }
            if (!foundValue) {
                $('#yearMonthInput').prepend($('<option />').val(myValue).html(months[parseInt(myValue.split('-')[1]-1)] + " " + myValue.split('-')[0]).prop("selected",true))
            }
        })
    </script>
</head>
<body>
    <select class="form-control" id="yearMonthInput"></select>
    <select class="ds-select " id="possibleRFPYYYYMM" name="possibleRFPYYYYMM" data-value=""><option value="">Select ...</option>
        <optgroup label="2021"><option value="2021-03">Mar 2021</option><option value="2021-04">Apr 2021</option><option value="2021-05">May 2021</option><option value="2021-06">Jun 2021</option><option value="2021-07">Jul 2021</option><option value="2021-08">Aug 2021</option><option value="2021-09">Sep 2021</option><option value="2021-10">Oct 2021</option><option value="2021-11">Nov 2021</option><option value="2021-12">Dec 2021</option></optgroup><optgroup label="2022"><option value="2022-01">Jan 2022</option><option value="2022-02">Feb 2022</option><option value="2022-03">Mar 2022</option><option value="2022-04">Apr 2022</option><option value="2022-05">May 2022</option><option value="2022-06">Jun 2022</option><option value="2022-07">Jul 2022</option><option value="2022-08">Aug 2022</option><option value="2022-09">Sep 2022</option><option value="2022-10">Oct 2022</option><option value="2022-11">Nov 2022</option><option value="2022-12">Dec 2022</option></optgroup><optgroup label="2023"><option value="2023-01">Jan 2023</option><option value="2023-02">Feb 2023</option><option value="2023-03">Mar 2023</option><option value="2023-04">Apr 2023</option><option value="2023-05">May 2023</option><option value="2023-06">Jun 2023</option><option value="2023-07">Jul 2023</option><option value="2023-08">Aug 2023</option><option value="2023-09">Sep 2023</option><option value="2023-10">Oct 2023</option><option value="2023-11">Nov 2023</option><option value="2023-12">Dec 2023</option></optgroup></select>
</body>
</html>
